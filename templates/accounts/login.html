{% extends "base.html" %}
{% block title %}Login - Prime Cuts Salon & Barbershop{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px;">
    <h1 class="mb-4">Login</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        {% if form.errors %}<div class="text-danger small mb-3">Invalid username or password.</div>{% endif %}
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 text-center">No account? <a href="{% url 'accounts:register' %}">Sign up</a></p>
</div>
{% endblock %}
