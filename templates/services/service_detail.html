{% extends "base.html" %}
{% block title %}{{ service.name }} - Prime Cuts Salon & Barbershop{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:700px;">
    <h1>{{ service.name }}</h1>
    <p class="text-muted">{{ service.duration_minutes }} minutes &middot; ₦{{ service.price }}</p>
    <p>{{ service.description }}</p>
    <a href="{% url 'appointments:book_appointment' %}?service={{ service.pk }}" class="btn btn-primary">Book This Service</a>
</div>
{% endblock %}
